<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe3">
<title>芽帖</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--washi:#f4efe3;--kami:#fbf8f0;--sumi:#2b2a28;--usu:#7a7468;--sen:#d8cfbc;--shu:#c8402f;--shu-usu:#f3ddd6;--wakaba:#5f7f4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--washi);color:var(--sumi);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;font-size:16px;line-height:1.6;
 background-image:radial-gradient(rgba(120,100,60,.06) 1px,transparent 1px);background-size:5px 5px}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:4px 0 16px;border-bottom:2px solid var(--sumi);padding-bottom:10px}
.han{width:38px;height:38px;flex:none;background:var(--shu);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;border-radius:4px}
h1{font-size:22px;margin:0;letter-spacing:.2em}
h1 small{display:block;font-size:11px;color:var(--usu);letter-spacing:.1em;font-weight:400}
h2{font-size:15px;margin:22px 0 8px;letter-spacing:.15em;border-left:4px solid var(--shu);padding-left:8px}
p{margin:6px 0}
.card{background:var(--kami);border:1px solid var(--sen);border-radius:6px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--usu);font-size:13px}
.err{color:var(--shu);font-size:13px;word-break:break-all}
button{font:inherit;color:var(--sumi);background:var(--kami);border:1px solid var(--sumi);border-radius:4px;padding:10px 14px;min-height:44px;cursor:pointer}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35}
button.shu{background:var(--shu);border-color:var(--shu);color:#fff}
button.ghost{border-color:var(--sen);color:var(--usu)}
button.sm{padding:4px 9px;min-height:38px;min-width:38px}
button.wide{width:100%;margin-top:8px}
input,select{font:inherit;color:var(--sumi);background:#fff;border:1px solid var(--sen);border-radius:4px;padding:9px 8px;min-height:42px;width:100%}
select{width:auto}
label.f{display:block;font-size:12px;color:var(--usu);margin:8px 0 2px;letter-spacing:.1em}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--kami);border-top:2px solid var(--sumi);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:10px 0;font-size:13px;color:var(--usu)}
nav button b{display:block;font-size:20px}
nav button.on{color:var(--shu)}
/* 今日 */
.day{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.day .d{flex:1;text-align:center;font-size:18px;font-weight:700;letter-spacing:.1em}
.day .d small{display:block;font-size:12px;color:var(--usu);font-weight:400}
.habit{display:flex;align-items:center;gap:12px}
.habit .cue{font-size:12px;color:var(--usu)}
.habit .nm{font-size:19px;font-weight:700;word-break:break-word;line-height:1.35}
.habit.done{background:#f7f3e8}
.habit.done .nm{color:var(--usu)}
.habit .do{min-width:92px;min-height:56px;font-size:17px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.stamp{width:60px;height:60px;border:3px solid var(--shu);color:var(--shu);background:none;border-radius:8px;display:grid;place-items:center;font-size:24px;font-weight:700;transform:rotate(-6deg);padding:0}
.stamp.plus{background:var(--shu);color:#fff}
.bar{height:6px;background:var(--sen);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--shu)}
.all{text-align:center;color:var(--shu);font-weight:700;letter-spacing:.3em;margin:14px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{min-height:38px;padding:6px 12px;font-size:14px;border-color:var(--sen)}
/* 記録 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;text-align:center}
.stats div{border:1px solid var(--sen);border-radius:4px;padding:6px 2px;font-size:11px;color:var(--usu)}
.stats b{display:block;font-size:20px;color:var(--sumi);font-variant-numeric:tabular-nums}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;background:#e9e2d0}
.heat i.x{background:none}
.heat i.a{background:#e6a99f}
.heat i.b{background:var(--shu)}
.heat i.t{outline:2px solid var(--sumi);outline-offset:-1px}
.legend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--usu);margin-top:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:3px}
/* 編集 */
.ed{border-bottom:1px dashed var(--sen);padding:10px 0}
.ed:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--sumi);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:9;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
'use strict';
const KEY='mecho.v1',VER='1.0';
const N=window.Native||null; // APK版のネイティブ連携（ブラウザではnull）
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toDate=s=>{const a=s.split('-');return new Date(+a[0],a[1]-1,+a[2])};
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return ymd(d)};
const WD='日月火水木金土';
const jdate=s=>{const d=toDate(s);return (d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）'};

/* ---------- 保存 ---------- */
const DEF_SET={dayStart:3};
function load(){
 try{const d=JSON.parse(localStorage.getItem(KEY));
  if(d&&Array.isArray(d.habits))return {habits:d.habits,log:d.log||{},settings:Object.assign({},DEF_SET,d.settings),sync:d.sync||{}}}catch(e){}
 return {habits:[],log:{},settings:Object.assign({},DEF_SET),sync:{}};
}
let S=load();
let syncTimer=null;
function save(dirty){
 if(dirty!==false)S.sync.dirty=true;
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('保存に失敗しました')}
 if(dirty!==false){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),1500)}
}

/* ---------- 日付・集計 ---------- */
// 深夜も「前日」として扱えるよう、切替時刻までは前の日とみなす
const today=()=>ymd(new Date(Date.now()-S.settings.dayStart*3600000));
const active=()=>S.habits.filter(h=>!h.archived);
const val=(date,id)=>(S.log[date]&&S.log[date][id])||0;
function setVal(date,id,v){
 if(v){(S.log[date]=S.log[date]||{})[id]=v}
 else if(S.log[date]){delete S.log[date][id];if(!Object.keys(S.log[date]).length)delete S.log[date]}
}
function stats(h){
 const t=today(),start=h.created||t;
 let cur=0,d=val(t,h.id)?t:addDays(t,-1);
 while(d>=start&&val(d,h.id)){cur++;d=addDays(d,-1)}
 // 開始日より前に遡って記入した分も数える
 if(d<start)while(val(d,h.id)){cur++;d=addDays(d,-1)}
 const days=Object.keys(S.log).filter(k=>val(k,h.id)).sort();
 let best=0,run=0,prev=null,bonus=0;
 days.forEach(k=>{run=(prev&&addDays(prev,1)===k)?run+1:1;if(run>best)best=run;prev=k;if(val(k,h.id)===2)bonus++});
 let span=0,hit=0;
 for(let i=0;i<30;i++){const k=addDays(t,-i);if(k<start&&!val(k,h.id))break;span++;if(val(k,h.id))hit++}
 return {cur,best,bonus,total:days.length,rate:span?Math.round(hit/span*100):0};
}

/* ---------- 画面状態 ---------- */
let view='today',cur=null; // cur: 表示中の日付（nullなら今日）
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}

/* ---------- 書き出し ---------- */
const backupAll=()=>JSON.stringify({app:'mecho',version:1,saved:new Date().toISOString(),habits:S.habits,log:S.log,settings:S.settings},null,2);
function toMd(){
 const t=today(),out=['# 芽帖　小さな習慣の記録',''];
 const keys=Object.keys(S.log);if(!keys.includes(t))keys.push(t);
 keys.sort().reverse().forEach(k=>{
  const hs=S.habits.filter(h=>val(k,h.id)||(!h.archived&&(h.created||k)<=k));
  if(!hs.length)return;
  out.push('## '+k);
  hs.forEach(h=>{const v=val(k,h.id);out.push('- ['+(v?'x':' ')+'] '+h.name+(v===2?'（おまけ）':''))});
  out.push('');
 });
 return out.join('\n');
}
function importText(text){
 try{
  const d=JSON.parse(text);
  if(!d||!Array.isArray(d.habits))return toast('芽帖のバックアップではありません');
  S.habits=d.habits.filter(h=>h&&h.id&&h.name);
  S.log=(d.log&&typeof d.log==='object')?d.log:{};
  S.settings=Object.assign({},DEF_SET,d.settings);
  save();view='today';cur=null;render();toast('読み込みました（習慣'+S.habits.length+'件）');
 }catch(e){toast('JSONを読み込めませんでした')}
}
function dl(name,text,type){
 if(N){pend=text;try{N.pick(1,name,type)}catch(e){toast('保存できませんでした')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
let pend='';

/* ---------- Googleドライブ自動同期（APK版） ---------- */
let syncing=false,again=false,verbose=false;
function syncNow(v){
 if(!N||!(S.sync.json||S.sync.md))return;
 if(v)verbose=true;
 if(syncing){again=true;return}
 clearTimeout(syncTimer);
 syncing=true;again=false;S.sync.dirty=false;S.sync.err='';
 const q=[];if(S.sync.json)q.push(['json',backupAll()]);if(S.sync.md)q.push(['md',toMd()]);
 syncQ=q;syncStep();
}
let syncQ=[];
function syncStep(){
 const j=syncQ.shift();
 if(!j)return syncEnd();
 try{N.writeAsync(j[0],S.sync[j[0]],j[1])}catch(e){S.sync.err=String(e);syncEnd()}
}
// ネイティブ側から書き込み完了時に呼ばれる
window.onWritten=function(key,err){
 if(key==='once'){toast(err?'保存できませんでした':'保存しました');return}
 if(err){S.sync.err=err;syncQ=[]}
 syncStep();
};
function syncEnd(){
 syncing=false;
 if(S.sync.err)S.sync.dirty=true;else S.sync.at=new Date().toISOString();
 save(false);
 if(verbose){toast(S.sync.err?'同期に失敗しました':'ドライブに保存しました');verbose=false}
 if(view==='kura')render();
 if(again&&!S.sync.err)syncNow();
}
// ネイティブ側から保存先・ファイル選択の結果が返る
window.onPicked=function(req,uri){
 if(req===1){try{N.writeAsync('once',uri,pend)}catch(e){toast('保存できませんでした')}pend='';return}
 if(req===2){S.sync.json=uri;save(false);syncNow(true);render();return}
 if(req===3){S.sync.md=uri;save(false);syncNow(true);render();return}
 if(req===4){let t=null;try{t=N.read(uri)}catch(e){}if(t==null)return toast('読み込めませんでした');importText(t)}
};
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(S.sync.dirty)syncNow()}
 else{render()} // 日付が変わっていれば表示を更新
});

/* ---------- 描画 ---------- */
function head(sub){return `<header><div class="han">芽</div><h1>芽帖<small>${sub}</small></h1></header>`}
const EX=[['腕立て伏せを1回する','朝、顔を洗ったら'],['本を2ページ読む','布団に入ったら'],['日記を1行書く','夕食を終えたら'],['水を1杯飲む','起きたら']];

function vToday(){
 const t=today(),d=cur||t,hs=active().filter(h=>(h.created||d)<=d||val(d,h.id));
 let h=head('ばかばかしいほど小さく、毎日つづける');
 if(!active().length){
  return h+`<div class="card"><p><b>小さな習慣のやり方</b></p>
  <p class="muted">一、失敗しようがないほど小さな目標にする（腕立て1回、本を2ページ）。<br>二、毎日かならずやる。気が乗らない日も、小さいので出来る。<br>三、余力があれば「おまけ」をしてよい。しなくても達成は達成。</p>
  <p class="muted">まずは一つか二つ。例から選ぶか、「習慣」で自分の言葉で作れます。</p>
  <div class="chips">${EX.map((e,i)=>`<button data-act="ex" data-i="${i}">＋ ${esc(e[0])}</button>`).join('')}</div></div>`;
 }
 const n=hs.filter(x=>val(d,x.id)).length;
 h+=`<div class="day"><button class="sm ghost" data-act="prev">◀</button>
  <div class="d">${jdate(d)}<small>${d===t?'今日':'さかのぼって記入中'}</small></div>
  <button class="sm ghost" data-act="next" ${d>=t?'disabled':''}>▶</button></div>
  <div class="row muted"><span class="grow">達成　${n} / ${hs.length}</span>${d!==t?'<button class="sm ghost" data-act="now">今日へ</button>':''}</div>
  <div class="bar"><i style="width:${hs.length?n/hs.length*100:0}%"></i></div>`;
 if(!hs.length)h+=`<p class="muted">この日にはまだ習慣がありませんでした。</p>`;
 hs.forEach(x=>{
  const v=val(d,x.id);
  h+=`<div class="card habit ${v?'done':''}"><div class="grow">
   ${x.cue?`<div class="cue">${esc(x.cue)}</div>`:''}<div class="nm">${esc(x.name)}</div>
   ${v===2?'<div class="cue">おまけまで出来た</div>':''}</div><div class="side">
   ${v?`<button class="stamp ${v===2?'plus':''}" data-act="undo" data-id="${x.id}">${v===2?'済＋':'済'}</button>
    ${v===1?`<button class="sm ghost" data-act="bonus" data-id="${x.id}">おまけ＋</button>`:''}`
    :`<button class="shu do" data-act="done" data-id="${x.id}">できた</button>`}</div></div>`;
 });
 if(hs.length&&n===hs.length)h+=`<div class="all">本日 皆済</div>`;
 h+=`<p class="muted">朱印を押すと一段階もどせます（済＋ → 済 → 未）。</p>`;
 return h;
}

function vRec(){
 const t=today(),hs=active();
 let h=head('つづいた日々');
 if(!hs.length)return h+`<p class="muted">習慣を登録すると、ここに記録が並びます。</p>`;
 // 直近12週（今週を右端に）
 const end=addDays(t,6-toDate(t).getDay()),first=addDays(end,-83);
 hs.forEach(x=>{
  const s=stats(x);let cells='';
  for(let i=0;i<84;i++){const k=addDays(first,i),v=val(k,x.id);
   cells+=`<i class="${k>t?'x':v===2?'b':v?'a':''}${k===t?' t':''}"></i>`}
  h+=`<div class="card"><div class="nm" style="font-weight:700">${esc(x.name)}</div>
   <div class="stats"><div><b>${s.cur}</b>連続日数</div><div><b>${s.best}</b>最長</div><div><b>${s.rate}%</b>30日達成率</div><div><b>${s.bonus}</b>おまけ</div></div>
   <div class="heat">${cells}</div>
   <div class="legend"><span>直近12週</span><span><i style="background:#e6a99f"></i>達成</span><span><i style="background:var(--shu)"></i>おまけ</span><span>通算 ${s.total}日</span></div></div>`;
 });
 return h;
}

function vEdit(){
 const hs=active(),arc=S.habits.filter(x=>x.archived);
 let h=head('習慣をととのえる');
 h+=`<h2>新しい習慣</h2><div class="card">
  <label class="f">小さな目標（失敗しようがない大きさで）</label><input id="nName" placeholder="例：腕立て伏せを1回する" maxlength="60">
  <label class="f">きっかけ（任意）</label><input id="nCue" placeholder="例：朝、顔を洗ったら" maxlength="60">
  <button class="shu wide" data-act="add">追加する</button>
  ${hs.length>=4?'<p class="muted">小さな習慣は同時に4つまでが目安です。増やすより、今あるものを毎日つづけることを優先してください。</p>':''}</div>`;
 if(hs.length){
  h+=`<h2>つづけている習慣</h2><div class="card">`;
  hs.forEach((x,i)=>{h+=`<div class="ed">
   <input data-f="name" data-id="${x.id}" value="${esc(x.name)}" maxlength="60">
   <input data-f="cue" data-id="${x.id}" value="${esc(x.cue||'')}" placeholder="きっかけ（任意）" maxlength="60" style="margin-top:6px;font-size:14px">
   <div class="row" style="margin-top:6px"><span class="grow muted">${x.created||''} から</span>
   <button class="sm ghost" data-act="up" data-id="${x.id}" ${i?'':'disabled'}>↑</button>
   <button class="sm ghost" data-act="down" data-id="${x.id}" ${i<hs.length-1?'':'disabled'}>↓</button>
   <button class="sm ghost" data-act="arc" data-id="${x.id}">休止</button></div></div>`});
  h+=`</div>`;
 }
 if(arc.length){
  h+=`<h2>休止中</h2><div class="card">`;
  arc.forEach(x=>{h+=`<div class="ed row"><span class="grow">${esc(x.name)}</span>
   <button class="sm ghost" data-act="unarc" data-id="${x.id}">再開</button>
   <button class="sm ghost" data-act="del" data-id="${x.id}">削除</button></div>`});
  h+=`</div><p class="muted">休止しても記録は残ります。削除すると記録も消えます。</p>`;
 }
 return h;
}

function vKura(){
 const sy=S.sync,on=sy.json||sy.md;
 let h=head('保存と設定');
 h+=`<h2>Googleドライブ自動同期</h2><div class="card">`;
 if(!N)h+=`<p class="muted">自動同期はAPK版で使えます。この画面では下の「書き出す」で手動保存してください。</p>`;
 else{
  h+=`<p class="muted">保存先を一度選ぶと、記録するたびに自動で上書き保存します。選択画面で「ドライブ」を選んでください。</p>
  <div class="row" style="margin-top:8px"><span class="grow">バックアップ（JSON）<br><span class="muted">${sy.json?'設定済み':'未設定'}</span></span><button class="sm" data-act="syncJ">${sy.json?'変更':'同期先を選ぶ'}</button></div>
  <div class="row" style="margin-top:8px"><span class="grow">記録（Markdown）<br><span class="muted">${sy.md?'設定済み':'未設定・任意（Obsidian等で読む用）'}</span></span><button class="sm" data-act="syncM">${sy.md?'変更':'同期先を選ぶ'}</button></div>`;
  if(on){
   h+=`<p class="muted" style="margin-top:10px">最終同期：${sy.at?new Date(sy.at).toLocaleString('ja-JP'):'まだ'}${sy.dirty&&!sy.err?'　（未同期の変更あり）':''}</p>
   ${sy.err?`<p class="err">同期エラー：${esc(sy.err)}<br>保存先を選び直すと直ることがあります。</p>`:''}
   <div class="row"><button class="grow" data-act="syncGo">今すぐ同期</button><button class="ghost" data-act="syncOff">解除</button></div>`;
  }
 }
 h+=`</div><h2>バックアップ</h2><div class="card">
  <div class="row"><button class="grow" data-act="exp">書き出す（JSON）</button><button class="grow" data-act="expMd">記録（MD）</button></div>
  <button class="wide ghost" data-act="imp">${N?'ドライブ等から読み込んで置き換える':'JSONを読み込んで置き換える'}</button>
  <p class="muted">機種変更や入れ直しのときは、ここからドライブ上の mecho-backup.json を選ぶと元に戻せます。</p></div>
  <h2>設定</h2><div class="card"><div class="row"><span class="grow">日付の切替時刻<br><span class="muted">この時刻までは前の日として記録</span></span>
  <select id="dayStart">${[0,1,2,3,4,5,6].map(n=>`<option value="${n}" ${n===S.settings.dayStart?'selected':''}>${n}:00</option>`).join('')}</select></div></div>
  <p class="muted" style="text-align:center">芽帖 v${VER}${N?'（APK版）':''}</p>`;
 return h;
}

function render(){
 const t=today();if(cur&&cur>=t)cur=null;
 $('#app').innerHTML=({today:vToday,rec:vRec,edit:vEdit,kura:vKura}[view])();
 $('#nav').innerHTML=[['today','今','今日'],['rec','録','記録'],['edit','習','習慣'],['kura','蔵','保存']]
  .map(a=>`<button data-nav="${a[0]}" class="${view===a[0]?'on':''}"><b>${a[1]}</b>${a[2]}</button>`).join('');
}

/* ---------- 操作 ---------- */
const byId=id=>S.habits.find(h=>h.id===id);
function addHabit(name,cue){
 name=(name||'').trim();if(!name)return toast('小さな目標を入れてください');
 S.habits.push({id:uid(),name,cue:(cue||'').trim(),created:today()});save();return true;
}
function move(id,dir){
 const a=active(),i=a.findIndex(h=>h.id===id),j=i+dir;if(i<0||j<0||j>=a.length)return;
 const x=S.habits.indexOf(a[i]),y=S.habits.indexOf(a[j]);[S.habits[x],S.habits[y]]=[S.habits[y],S.habits[x]];save();render();
}
function arm(el,label){ // 二度押しで確定
 if(el.dataset.ok)return true;
 el.dataset.ok=1;el.textContent=label;el.style.color='var(--shu)';el.style.borderColor='var(--shu)';return false;
}
const A={
 ex(el){const e=EX[+el.dataset.i];if(addHabit(e[0],e[1]))render()},
 done(el){setVal(cur||today(),el.dataset.id,1);save();render()},
 bonus(el){setVal(cur||today(),el.dataset.id,2);save();render()},
 undo(el){const d=cur||today(),v=val(d,el.dataset.id);setVal(d,el.dataset.id,v-1);save();render()},
 prev(){cur=addDays(cur||today(),-1);render()},
 next(){cur=addDays(cur||today(),1);render()},
 now(){cur=null;render()},
 add(){if(addHabit($('#nName').value,$('#nCue').value)){render();toast('追加しました')}},
 up(el){move(el.dataset.id,-1)},
 down(el){move(el.dataset.id,1)},
 arc(el){byId(el.dataset.id).archived=true;save();render()},
 unarc(el){delete byId(el.dataset.id).archived;save();render()},
 del(el){if(!arm(el,'本当に削除'))return;const id=el.dataset.id;
  S.habits=S.habits.filter(h=>h.id!==id);Object.keys(S.log).forEach(k=>setVal(k,id,0));save();render()},
 exp(){dl('mecho-backup-'+today()+'.json',backupAll(),'application/json')},
 expMd(){dl('mecho-log-'+today()+'.md',toMd(),'text/markdown')},
 imp(el){if(S.habits.length&&!arm(el,'今のデータを置き換える（もう一度押す）'))return;
  if(N){try{N.open(4)}catch(e){toast('開けませんでした')}return}
  const f=$('#file');f.value='';f.click()},
 syncJ(){N.pick(2,'mecho-backup.json','application/json')},
 syncM(){N.pick(3,'mecho-log.md','text/markdown')},
 syncGo(){syncNow(true)},
 syncOff(el){if(!arm(el,'本当に解除'))return;S.sync={};save(false);render()},
};
document.addEventListener('click',e=>{
 const n=e.target.closest('[data-nav]');if(n){view=n.dataset.nav;render();window.scrollTo(0,0);return}
 const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b);
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='dayStart'){S.settings.dayStart=+el.value;save();return}
 if(el.id==='file'&&el.files[0]){const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(el.files[0]);return}
 if(el.dataset.f){const h=byId(el.dataset.id);if(!h)return;const v=el.value.trim();
  if(el.dataset.f==='name'&&!v){el.value=h.name;return toast('目標は空にできません')}
  h[el.dataset.f]=v;save()}
});
render();
if(S.sync.dirty)setTimeout(()=>syncNow(),800);
</script>
</body>
</html>
