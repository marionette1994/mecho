name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 署名鍵：Secrets(KEYSTORE_B64)があればそれを使い、無ければ初回に生成してキャッシュで使い回す
      - uses: actions/cache@v4
        with:
          path: signing
          key: mecho-keystore-v1

      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          mkdir -p signing
          PASS="${KEYSTORE_PASS:-mecho-key}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > signing/release.jks
          elif [ ! -f signing/release.jks ]; then
            keytool -genkeypair -keystore signing/release.jks -storepass "$PASS" -keypass "$PASS" \
              -alias mecho -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=mecho"
          fi

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle --no-daemon assembleRelease

      - name: Collect
        run: cp app/build/outputs/apk/release/app-release.apk mecho.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mecho-apk
          path: mecho.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.1.${{ github.run_number }}" mecho.apk \
            --title "芽帖 v1.1.${{ github.run_number }}" \
            --notes "Android用APK。mecho.apk をダウンロードしてインストールしてください。"
